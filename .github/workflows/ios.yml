name: Build iOS App

on:
  push:
    branches:
      - main
      - redesign
    paths:
      - 'mobile/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA & App Bundle
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.2'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Code Generation (Drift / Build Runner)
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare iOS Config & CocoaPods
        working-directory: mobile
        run: |
          flutter build ios --config-only --no-codesign || true
          cd ios
          pod install --repo-update

      - name: Build iOS (Release, No Code Sign)
        working-directory: mobile
        run: |
          flutter build ios --release --no-codesign || {
            echo "Flutter CLI exited, falling back to direct xcodebuild..."
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/ios_derived \
              CONFIGURATION_BUILD_DIR=build/ios/iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          }

      - name: Package Payload into IPA
        working-directory: mobile
        run: |
          echo "Locating Runner.app..."
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d | head -n 1)
          fi
          echo "Found Runner.app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: Runner.app not found!"
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q StudyPlan-iOS-Unsigned.ipa Payload
          APP_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          (cd "$APP_DIR" && zip -r -q "$GITHUB_WORKSPACE/mobile/StudyPlan-Runner.app.zip" "$APP_NAME")

      - name: Upload iOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StudyPlan-iOS-Build
          path: |
            mobile/StudyPlan-iOS-Unsigned.ipa
            mobile/StudyPlan-Runner.app.zip
          retention-days: 14
