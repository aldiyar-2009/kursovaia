<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyPlan — администрирование</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand">StudyPlan</div>
      <h1>Вход для администратора</h1>
      <label>Email<input name="email" type="email" required autocomplete="username"></label>
      <label>Пароль<input name="password" type="password" required minlength="6" autocomplete="current-password"></label>
      <p id="login-error" class="error" role="alert"></p>
      <button type="submit" class="btn primary">Войти</button>
      <p class="hint">Доступ только для пользователей с ролью «Администратор».</p>
    </form>
  </main>

  <!-- App -->
  <div id="app-view" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand">StudyPlan <span>admin</span></div>
      <nav>
        <button class="nav-item" data-view="dashboard">Сводка</button>
        <button class="nav-item" data-view="users">Пользователи</button>
        <button class="nav-item" data-view="announcements">Объявления</button>
      </nav>
      <div class="sidebar-footer">
        <div id="me-name" class="me"></div>
        <button id="logout" class="btn ghost">Выйти</button>
      </div>
    </aside>

    <main class="content">
      <section id="view-dashboard" class="view" hidden>
        <header class="view-head"><h2>Сводка</h2></header>
        <div id="stats" class="stats"></div>
      </section>

      <section id="view-users" class="view" hidden>
        <header class="view-head">
          <h2>Пользователи</h2>
          <button id="add-user" class="btn primary">Добавить пользователя</button>
        </header>
        <div class="toolbar">
          <input id="user-search" type="search" placeholder="Поиск по имени или email">
          <select id="user-role-filter">
            <option value="">Все роли</option>
            <option value="user">Пользователь</option>
            <option value="admin">Администратор</option>
          </select>
          <select id="user-blocked-filter">
            <option value="">Любой статус</option>
            <option value="false">Активные</option>
            <option value="true">Заблокированные</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Имя</th><th>Email</th><th>Роль</th><th>Группа</th><th>Статус</th><th>Создан</th><th></th></tr></thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
      </section>

      <section id="view-announcements" class="view" hidden>
        <header class="view-head">
          <h2>Объявления</h2>
          <button id="add-announcement" class="btn primary">Новое объявление</button>
        </header>
        <p class="muted">Опубликованные объявления показываются на главном экране мобильного приложения.</p>
        <div id="announcements-list" class="rows"></div>
      </section>
    </main>
  </div>

  <dialog id="user-dialog">
    <form id="user-form" method="dialog">
      <h3 id="user-dialog-title">Пользователь</h3>
      <label>Имя<input name="name" required maxlength="120"></label>
      <label>Email<input name="email" type="email" required></label>
      <label>Роль
        <select name="role"><option value="user">Пользователь</option><option value="admin">Администратор</option></select>
      </label>
      <label><span id="password-label">Пароль</span><input name="password" type="password" minlength="6" autocomplete="new-password"></label>
      <p class="error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close>Отмена</button>
        <button type="submit" class="btn primary">Сохранить</button>
      </div>
    </form>
  </dialog>

  <dialog id="announcement-dialog">
    <form id="announcement-form" method="dialog">
      <h3 id="announcement-dialog-title">Объявление</h3>
      <label>Заголовок<input name="title" required maxlength="200"></label>
      <label>Текст<textarea name="body" required rows="6" maxlength="20000"></textarea></label>
      <label class="check"><input name="is_published" type="checkbox"> Опубликовать сразу</label>
      <p class="error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close>Отмена</button>
        <button type="submit" class="btn primary">Сохранить</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
